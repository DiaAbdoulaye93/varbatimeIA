[project]
name = "sat-verbatim-analyzer"
version = "0.1.0"
description = "Automatic analysis of satisfaction survey verbatims with Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.157.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Installed in editable mode by `uv sync` so scripts/ and tests/ can import `app`.
[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
