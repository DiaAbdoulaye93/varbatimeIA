[project]
name = "sat-verbatim-analyzer"
version = "0.1.0"
description = "Automatic analysis of satisfaction survey verbatims with Claude"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=1.17.0",
    "fastapi>=0.157.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.1",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.48",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
