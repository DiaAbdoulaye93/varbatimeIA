# Local development: FastAPI with hot reload, using the PostgreSQL installed on the host.
#
#   POSTGRES_PASSWORD=... docker compose up        (or put POSTGRES_PASSWORD in ./.env)
#   -> http://localhost:8000/docs
#
# No Dockerfile here on purpose: the single multi-stage Dockerfile (session 4) builds the
# production image. This setup mounts the code and runs it in the official uv image.
services:
  api:
    image: ghcr.io/astral-sh/uv:python3.12-trixie-slim
    working_dir: /app/backend
    command: >
      sh -c "uv sync --frozen &&
             uv run uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"
    env_file: backend/.env
    environment:
      # Same database as `uv run uvicorn` on the host, reached from the container.
      DATABASE_URL: postgresql+psycopg://postgres:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@host.docker.internal:5432/sat_verbatim
      # Keep the Linux virtualenv out of the mounted Windows project folder.
      UV_PROJECT_ENVIRONMENT: /opt/venv
      UV_LINK_MODE: copy
    volumes:
      - ./backend:/app/backend
      - ./data:/app/data:ro
      - venv:/opt/venv
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  venv:
