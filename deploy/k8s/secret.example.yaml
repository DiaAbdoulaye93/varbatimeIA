# EXAMPLE ONLY - never commit real values. Create the secrets by hand instead:
#
#   kubectl -n sat create secret generic anthropic-api-key \
#     --from-literal=ANTHROPIC_API_KEY=sk-ant-...
#   kubectl -n sat create secret generic database-url \
#     --from-literal=DATABASE_URL=postgresql+psycopg://USER:PASSWORD@HOST:5432/sat_verbatim
apiVersion: v1
kind: Secret
metadata:
  name: anthropic-api-key
  namespace: sat
type: Opaque
stringData:
  ANTHROPIC_API_KEY: sk-ant-REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: database-url
  namespace: sat
type: Opaque
stringData:
  DATABASE_URL: postgresql+psycopg://USER:PASSWORD@HOST:5432/sat_verbatim
